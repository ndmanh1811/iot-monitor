<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Dữ liệu cảm biến - IoT Monitor</title>
  <!-- Tailwind CSS v3 with Plugins -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono-val { font-family: 'JetBrains Mono', monospace; }

    @media (min-height: 550px) {
      html, body {
        height: 100%;
        overflow: hidden;
      }
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 antialiased h-screen overflow-hidden flex selection:bg-blue-100 selection:text-blue-700">

  <!-- BEGIN: Sidebar -->
  <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between shrink-0 h-screen sticky top-0 z-30">
    <div>
      <!-- Brand Logo -->
      <div class="px-6 py-6 border-b border-slate-100 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
        </div>
        <div>
          <span class="block font-bold text-slate-900 tracking-tight text-lg leading-tight">IoT Monitor</span>
          <span class="text-xs text-slate-500 font-medium">Giám sát thông minh</span>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav aria-label="Menu chính" class="p-4 space-y-1.5">
        <!-- Tổng quan -->
        <a href="tongquan.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-50 font-medium text-sm transition-colors group">
          <svg class="w-5 h-5 text-slate-400 group-hover:text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
          <span>Tổng quan</span>
        </a>

        <!-- Dữ liệu cảm biến (ACTIVE) -->
        <a href="dulieucambien.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg bg-blue-50 text-blue-600 font-semibold text-sm transition-colors relative shadow-sm">
          <span class="absolute left-0 top-1.5 bottom-1.5 w-1 bg-blue-600 rounded-r-full"></span>
          <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
          <span>Dữ liệu cảm biến</span>
        </a>

        <!-- Lịch sử -->
        <a href="lichsuthietbi.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-50 font-medium text-sm transition-colors group">
          <svg class="w-5 h-5 text-slate-400 group-hover:text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
          <span>Lịch sử</span>
        </a>

        <!-- Hồ sơ -->
        <a href="hosocanhan.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-50 font-medium text-sm transition-colors group">
          <svg class="w-5 h-5 text-slate-400 group-hover:text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
          <span>Hồ sơ</span>
        </a>
      </nav>
    </div>

  </aside>
  <!-- END: Sidebar -->

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
    <!-- Header -->
    <header class="h-14 px-6 flex items-center justify-between border-b border-slate-200/80 bg-white shrink-0 z-20">
      <div class="flex items-center gap-3">
        <!-- Status chips -->
        <span id="esp-status-badge" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-600 border border-emerald-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          ESP8266 Online (MQTT)
        </span>
      </div>

      <!-- User Profile Header -->
      <div class="flex items-center gap-3">
        <div class="text-right leading-tight hidden sm:block">
          <p id="header-user-name" class="text-xs font-semibold text-slate-800">Nguyễn Đức Mạnh</p>
          <p id="header-user-email" class="text-[11px] text-slate-400">manhnd.b23cn532@stu.ptit.edu.vn</p>
        </div>
        <div class="relative">
          <div class="w-8 h-8 rounded-full ring-2 ring-slate-100 overflow-hidden bg-slate-100 flex items-center justify-center">
            <img id="header-user-avatar-img" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA1B3RJWDc_3dQEEBgIUv0hdwEPr3Ap-y45ELTvPUxglRnghH2VIhoUS6OPz29XAajIrpv4E5weVLBssIs22TmlUftW1dRcRfYX1yUHbOH4IgyMrMqTD17GwBJ4AHgcTJzMJGNlIIDMD33jzbRfcjjjExFQlJv_N3qgqiZkmblRUwaXTHMHMkTmha-s4wLLm2c5muhGF8mpmSZeyAG29GZRKzEqiwU-ai0hri4_gIj0HRdjMcpTGB-9qNDADC9pAJjkbazlwWC6GikEqA" alt="Avatar">
          </div>
          <span class="absolute bottom-0 right-0 w-2 h-2 rounded-full bg-emerald-500 ring-2 ring-white"></span>
        </div>
      </div>
    </header>

    <!-- Main Workspace Content -->
    <main class="flex-1 px-6 py-3 flex flex-col min-h-0 overflow-hidden max-w-7xl mx-auto w-full gap-2.5">
      <!-- Page Title -->
      <section class="shrink-0 flex items-center justify-between">
        <div>
          <h1 class="text-lg font-bold text-slate-900 tracking-tight leading-none">Dữ liệu cảm biến</h1>
        </div>
      </section>

      <!-- Filter Section (Chỉ 2 ô lọc theo yêu cầu: Dropdown tiêu chí & Ô nhập giá trị/thời gian) -->
      <section class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm shrink-0">
        <form onsubmit="handleFilterSubmit(event)" class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end">
          <!-- Ô lọc 1: Dropdown phân loại (col-span-4) -->
          <div class="md:col-span-4 space-y-1 flex flex-col justify-end">
            <label class="text-[11px] font-semibold text-slate-600 block leading-tight" for="filter-type">Tiêu chí lọc</label>
            <select id="filter-type" onchange="handleFilterTypeChange(); handleFilterSubmit();" class="w-full h-8 text-xs rounded-lg border-slate-200 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-slate-700 bg-slate-50/50 px-2.5 py-1 cursor-pointer">
              <option value="all">Tất cả cảm biến</option>
              <option value="temperature">Nhiệt độ (°C)</option>
              <option value="humidity">Độ ẩm (%)</option>
              <option value="light">Ánh sáng (Lux)</option>
              <option value="time">Thời gian</option>
            </select>
          </div>

          <!-- Ô lọc 2: Ô nhập giá trị số liệu hoặc thời gian (col-span-5) -->
          <div class="md:col-span-5 space-y-1 flex flex-col justify-end">
            <label id="filter-val-label" class="text-[11px] font-semibold text-slate-600 block leading-tight" for="filter-input-val">Giá trị / Thời gian cần tìm</label>
            <input id="filter-input-val" oninput="handleFilterSubmit()" class="w-full h-8 text-xs rounded-lg border-slate-200 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 placeholder-slate-400 bg-slate-50/50 px-2.5 py-1" placeholder="" type="text">
          </div>

          <!-- Action Buttons (col-span-3) -->
          <div class="md:col-span-3 flex items-center gap-2 pt-1 md:pt-0">
            <!-- Clear Filters Button -->
            <button onclick="resetFilters()" class="flex-1 h-8 px-3 rounded-lg border border-slate-200 hover:bg-slate-50 active:bg-slate-100 text-slate-700 font-medium text-xs transition text-center shadow-sm flex items-center justify-center cursor-pointer" type="button">
              Xóa bộ lọc
            </button>
            <!-- Apply Search Button -->
            <button class="flex-1 h-8 px-3 rounded-lg bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium text-xs flex items-center justify-center transition cursor-pointer" type="submit">
              <span>Áp dụng tìm kiếm</span>
            </button>
          </div>
        </form>
      </section>

      <!-- Table Section -->
      <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex-1 min-h-0 flex flex-col">
        <div class="overflow-x-auto flex-1 min-h-0 overflow-y-auto">
          <table class="w-full text-left border-collapse text-xs">
            <!-- Table Header with Sort support -->
            <thead class="bg-slate-50/95 sticky top-0 border-b border-slate-200 text-slate-600 select-none z-10">
              <tr>
                <th onclick="sortColumn('id')" class="py-2.5 px-6 font-semibold w-24 text-center cursor-pointer hover:bg-slate-100/60 transition-colors" scope="col">
                  <div class="flex items-center justify-center gap-1.5">
                    <span>ID</span>
                    <span id="sort-icon-id" class="text-xs text-slate-400 font-bold">↕</span>
                  </div>
                </th>
                <th onclick="sortColumn('sensor_id')" class="py-2.5 px-6 font-semibold cursor-pointer hover:bg-slate-100/60 transition-colors" scope="col">
                  <div class="flex items-center gap-1.5">
                    <span>Mã Sensor</span>
                    <span id="sort-icon-sensor_id" class="text-xs text-slate-400 font-bold">↕</span>
                  </div>
                </th>
                <th class="py-2.5 px-6 font-semibold text-slate-600" scope="col">
                  <span>Loại cảm biến</span>
                </th>
                <th onclick="sortColumn('value')" class="py-2.5 px-6 font-semibold cursor-pointer hover:bg-slate-100/60 transition-colors" scope="col">
                  <div class="flex items-center gap-1.5">
                    <span>Giá trị</span>
                    <span id="sort-icon-value" class="text-xs text-slate-400 font-bold">↕</span>
                  </div>
                </th>
                <th onclick="sortColumn('recorded_at')" class="py-2.5 px-6 font-semibold cursor-pointer hover:bg-slate-100/60 transition-colors" scope="col">
                  <div class="flex items-center gap-1.5">
                    <span>Thời gian</span>
                    <span id="sort-icon-recorded_at" class="text-xs text-slate-400 font-bold">↕</span>
                  </div>
                </th>
              </tr>
            </thead>
            <!-- Dynamic Table Body -->
            <tbody id="sensor-table-body" class="divide-y divide-slate-100 font-medium">
              <!-- Rendered via js/sensor-data.js -->
            </tbody>
          </table>
        </div>

        <!-- Pagination Footer -->
        <div class="py-2.5 px-6 bg-slate-50/90 border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-500 font-medium shrink-0">
          <div class="flex items-center gap-2 text-xs text-slate-500 font-medium">
            <span>Hiển thị</span>
            <select onchange="changeLimit(this.value)" class="bg-white border border-slate-200 text-slate-700 text-xs rounded-lg py-0.5 px-2 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 cursor-pointer shadow-sm">
              <option selected="" value="10">10</option>
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            <span>bản ghi/trang</span>
            <span class="text-slate-300">•</span>
            <span>Tổng số <span id="total-records-count" class="font-semibold text-slate-800">12</span> kết quả</span>
          </div>

          <div class="flex items-center gap-1.5">
            <button id="btn-prev" onclick="prevPage()" class="px-2 py-0.5 rounded border border-slate-200 text-slate-600 hover:bg-slate-100 disabled:opacity-50 transition cursor-pointer">
              Trước
            </button>
            <div id="pagination-numbers" class="flex items-center gap-1"></div>
            <button id="btn-next" onclick="nextPage()" class="px-2 py-0.5 rounded border border-slate-200 text-slate-600 hover:bg-slate-100 disabled:opacity-50 transition cursor-pointer">
              Tiếp theo
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/colors.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sensor-data.js"></script>
</body>
</html>
