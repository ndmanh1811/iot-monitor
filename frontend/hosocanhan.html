<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Hồ sơ cá nhân - IoT Monitor</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-panel {
      background-color: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .ambient-shadow { box-shadow: 0px 12px 32px rgba(0, 0, 0, 0.04); }
    .input-field {
      background-color: #F8FAFC;
      border: 1px solid #E2E8F0;
      transition: all 0.2s ease-in-out;
    }
    .input-field:focus {
      background-color: #ffffff;
      border-color: #2563eb;
      outline: none;
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 antialiased h-screen overflow-hidden flex selection:bg-blue-100 selection:text-blue-700">

  <!-- BEGIN: Sidebar -->
  <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between shrink-0 h-screen sticky top-0 z-30">
    <div>
      <!-- Brand Logo -->
      <div class="px-6 py-6 border-b border-slate-100 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <div>
          <span class="block font-bold text-slate-900 tracking-tight text-lg leading-tight">IoT Monitor</span>
          <span class="text-xs text-slate-500 font-medium">Giám sát thông minh</span>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav aria-label="Menu chính" class="p-4 space-y-1.5">
        <!-- Tổng quan -->
        <a href="tongquan.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-50 font-medium text-sm transition-colors group">
          <svg class="w-5 h-5 text-slate-400 group-hover:text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
          </svg>
          <span>Tổng quan</span>
        </a>

        <!-- Dữ liệu cảm biến -->
        <a href="dulieucambien.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-50 font-medium text-sm transition-colors group">
          <svg class="w-5 h-5 text-slate-400 group-hover:text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" />
          </svg>
          <span>Dữ liệu cảm biến</span>
        </a>

        <!-- Lịch sử -->
        <a href="lichsuthietbi.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-50 font-medium text-sm transition-colors group">
          <svg class="w-5 h-5 text-slate-400 group-hover:text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span>Lịch sử</span>
        </a>

        <!-- Hồ sơ (ACTIVE) -->
        <a href="hosocanhan.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg bg-blue-50 text-blue-600 font-semibold text-sm transition-colors relative shadow-sm">
          <span class="absolute left-0 top-1.5 bottom-1.5 w-1 bg-blue-600 rounded-r-full"></span>
          <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <span>Hồ sơ</span>
        </a>
      </nav>
    </div>

  </aside>
  <!-- END: Sidebar -->

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
    <!-- Header -->
    <header class="h-14 px-6 flex items-center justify-between border-b border-slate-200/80 bg-white shrink-0 z-20">
      <div class="flex items-center gap-3">
        <!-- Status chips -->
        <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-600 border border-emerald-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          ESP8266 Online (MQTT)
        </span>
        <span id="ws-status-badge" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-50 text-blue-600 border border-blue-200">
          <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
          WebSocket: Đã kết nối
        </span>
      </div>

      <!-- User Profile Header -->
      <div class="flex items-center gap-3">
        <div class="text-right leading-tight hidden sm:block">
          <p id="header-user-name" class="text-xs font-semibold text-slate-800">Nguyễn Đức Mạnh</p>
          <p id="header-user-email" class="text-[11px] text-slate-400">manhnd.b23cn532@stu.ptit.edu.vn</p>
        </div>
        <div class="relative">
          <div class="w-8 h-8 rounded-full ring-2 ring-slate-100 overflow-hidden bg-slate-100 flex items-center justify-center">
            <img id="header-user-avatar-img" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA1B3RJWDc_3dQEEBgIUv0hdwEPr3Ap-y45ELTvPUxglRnghH2VIhoUS6OPz29XAajIrpv4E5weVLBssIs22TmlUftW1dRcRfYX1yUHbOH4IgyMrMqTD17GwBJ4AHgcTJzMJGNlIIDMD33jzbRfcjjjExFQlJv_N3qgqiZkmblRUwaXTHMHMkTmha-s4wLLm2c5muhGF8mpmSZeyAG29GZRKzEqiwU-ai0hri4_gIj0HRdjMcpTGB-9qNDADC9pAJjkbazlwWC6GikEqA" alt="Avatar">
          </div>
          <span class="absolute bottom-0 right-0 w-2 h-2 rounded-full bg-emerald-500 ring-2 ring-white"></span>
        </div>
      </div>
    </header>

    <!-- Main Workspace Content -->
    <main class="flex-1 px-6 py-3 flex flex-col min-h-0 overflow-hidden max-w-7xl mx-auto w-full gap-2.5">
      <!-- Page Title -->
      <section class="shrink-0 flex items-center justify-between">
        <div>
          <h1 class="text-lg font-bold text-slate-900 tracking-tight leading-none">Hồ sơ cá nhân</h1>
        </div>
      </section>

      <!-- Profile Form Card -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex-1 min-h-0 flex flex-col justify-between">
        <!-- Avatar Section -->
        <div class="p-3 border-b border-slate-200 flex items-center gap-4 shrink-0 bg-slate-50/40">
          <div class="w-14 h-14 rounded-full overflow-hidden border-2 border-blue-600/30 shadow-sm relative group cursor-pointer ring-2 ring-blue-600/10 shrink-0">
            <img id="avatar-preview-img" alt="Avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA1B3RJWDc_3dQEEBgIUv0hdwEPr3Ap-y45ELTvPUxglRnghH2VIhoUS6OPz29XAajIrpv4E5weVLBssIs22TmlUftW1dRcRfYX1yUHbOH4IgyMrMqTD17GwBJ4AHgcTJzMJGNlIIDMD33jzbRfcjjjExFQlJv_N3qgqiZkmblRUwaXTHMHMkTmha-s4wLLm2c5muhGF8mpmSZeyAG29GZRKzEqiwU-ai0hri4_gIj0HRdjMcpTGB-9qNDADC9pAJjkbazlwWC6GikEqA">
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="text-sm font-bold text-slate-900 leading-none">Ảnh đại diện sinh viên</h3>
          </div>
          <div>
            <input type="file" id="avatar-file-input" class="hidden" accept="image/*" onchange="handleAvatarUpload(event)">
            <button type="button" onclick="document.getElementById('avatar-file-input').click()" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-blue-600 bg-blue-50 hover:bg-blue-100 border border-blue-200 transition-all cursor-pointer">
              Tải ảnh mới
            </button>
          </div>
        </div>

        <!-- Main Form -->
        <form onsubmit="handleProfileSubmit(event)" class="flex-1 min-h-0 flex flex-col justify-between">
          <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-5 flex-1 min-h-0 overflow-y-auto">
            <!-- Cột trái: Thông tin cá nhân -->
            <div class="space-y-3">
              <h4 class="text-xs font-bold text-blue-600 uppercase tracking-wider pb-1 border-b border-slate-100">Thông tin cơ bản</h4>

              <!-- Họ và tên -->
              <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-slate-600">Họ và tên</label>
                <input id="profile-fullname" class="input-field rounded-lg px-3 py-1.5 text-xs text-slate-800 w-full" placeholder="Nguyễn Đức Mạnh" type="text" value="Nguyễn Đức Mạnh">
              </div>

              <!-- Mã số sinh viên -->
              <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-slate-600">Mã số sinh viên</label>
                <input id="profile-studentid" class="input-field rounded-lg px-3 py-1.5 text-xs text-slate-400 bg-slate-100 w-full cursor-not-allowed" disabled="" type="text" value="B23DCCN532">
              </div>

              <!-- Lớp -->
              <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-slate-600">Lớp</label>
                <input id="profile-class" class="input-field rounded-lg px-3 py-1.5 text-xs text-slate-800 w-full" placeholder="B23CNPM06" type="text" value="B23CNPM06">
              </div>

              <!-- Email -->
              <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-slate-600">Email</label>
                <input id="profile-email" class="input-field rounded-lg px-3 py-1.5 text-xs text-slate-800 w-full" placeholder="manhnd.b23cn532@stu.ptit.edu.vn" type="email" value="manhnd.b23cn532@stu.ptit.edu.vn">
              </div>
            </div>

            <!-- Cột phải: Liên kết ngoài & Tài nguyên nộp bài -->
            <div class="space-y-2.5">
              <h4 class="text-xs font-bold text-blue-600 uppercase tracking-wider pb-1 border-b border-slate-100">Liên kết ngoài &amp; Tài nguyên</h4>

              <!-- Github -->
              <div class="p-2.5 rounded-lg border border-slate-200 bg-slate-50/50">
                <div class="flex items-center justify-between mb-1">
                  <label class="text-[11px] font-bold text-slate-700">Github Repository</label>
                  <a id="link-github-btn" href="https://github.com/yourusername" target="_blank" class="text-[11px] font-semibold text-blue-600 hover:underline bg-blue-50 px-2 py-0.5 rounded transition-colors">
                    Mở
                  </a>
                </div>
                <input id="profile-github" class="input-field rounded-lg px-2.5 py-1 text-xs text-slate-800 w-full" placeholder="https://github.com/yourusername" type="url" value="https://github.com/yourusername">
              </div>

              <!-- Figma -->
              <div class="p-2.5 rounded-lg border border-slate-200 bg-slate-50/50">
                <div class="flex items-center justify-between mb-1">
                  <label class="text-[11px] font-bold text-slate-700">Thiết kế Figma</label>
                  <a id="link-figma-btn" href="https://figma.com" target="_blank" class="text-[11px] font-semibold text-blue-600 hover:underline bg-blue-50 px-2 py-0.5 rounded transition-colors">
                    Mở
                  </a>
                </div>
                <input id="profile-figma" class="input-field rounded-lg px-2.5 py-1 text-xs text-slate-800 w-full" placeholder="https://figma.com/..." type="url" value="https://figma.com/@iotmonitor-project">
              </div>

              <!-- Postman Link -->
              <div class="p-2.5 rounded-lg border border-slate-200 bg-slate-50/50">
                <div class="flex items-center justify-between mb-1">
                  <label class="text-[11px] font-bold text-slate-700">Link Postman API Docs</label>
                  <a id="link-postman-btn" href="https://documenter.getpostman.com/view/55143373/2sBYB4KmEN" target="_blank" class="text-[11px] font-semibold text-blue-600 hover:underline bg-blue-50 px-2 py-0.5 rounded transition-colors">
                    Mở
                  </a>
                </div>
                <input id="profile-postman" class="input-field rounded-lg px-2.5 py-1 text-xs text-slate-800 w-full" placeholder="https://documenter.getpostman.com/..." type="url" value="https://documenter.getpostman.com/view/55143373/2sBYB4KmEN">
              </div>

              <!-- Báo cáo tài liệu -->
              <div class="p-2.5 rounded-lg border border-slate-200 bg-slate-50/50">
                <div class="flex items-center justify-between mb-1">
                  <label class="text-[11px] font-bold text-slate-700">Link báo cáo tài liệu</label>
                  <a id="link-report-btn" href="https://report-link.com" target="_blank" class="text-[11px] font-semibold text-blue-600 hover:underline bg-blue-50 px-2 py-0.5 rounded transition-colors">
                    Mở
                  </a>
                </div>
                <input id="profile-report" class="input-field rounded-lg px-2.5 py-1 text-xs text-slate-800 w-full" placeholder="https://report-link.com/..." type="url" value="https://report-link.com/iot-b23dccn532-report">
              </div>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="px-4 py-2.5 bg-slate-50/80 border-t border-slate-200 flex justify-end gap-3 shrink-0">
            <button onclick="loadProfileData()" class="px-5 py-1.5 rounded-lg text-xs font-semibold text-slate-600 border border-slate-200 hover:bg-slate-100 transition-all cursor-pointer" type="button">
              Hủy bỏ
            </button>
            <button id="btn-save-profile" class="px-6 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-semibold hover:bg-blue-700 shadow-sm transition-all cursor-pointer" type="submit">
              Lưu thay đổi
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/colors.js"></script>
  <script src="js/api.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
